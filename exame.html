<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exame — PrepConcurso AO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilo.css?v=8" rel="stylesheet">
</head>
<body>
  <div class="faixa"></div>
  <div id="app"><div class="carregar"><div class="text-center"><div class="spinner-border text-primary mb-3"></div><div>A preparar o seu exame…</div></div></div></div>

  <!-- Ecrã de submissão -->
  <div id="aSubmeter" class="position-fixed top-0 start-0 w-100 h-100 d-none" style="background:rgba(14,35,80,.88);z-index:3000">
    <div class="h-100 d-grid" style="place-items:center"><div class="text-center text-white">
      <div class="spinner-border mb-3" style="width:3rem;height:3rem"></div>
      <h3 class="text-white titulo" id="aSubmeterTitulo">A submeter o exame…</h3>
      <p class="mb-0" style="color:#cfe3fa">Não feche esta página.</p></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
  <script>
  (async () => {
    const { sb, esc, toast, erroMsg, fmtHMS, TIPOS } = App;
    const perfil = await App.exigirSessao();
    if (App.perfilIncompleto(perfil)) { location.replace("painel.html"); return; }
    const params = new URLSearchParams(location.search);
    const tipo = params.get("tipo") === "conhecimento" ? "conhecimento" : "psico";
    const nPedido = Math.min(App.cfg.MAX_QUESTOES || 50, Math.max(App.cfg.MIN_QUESTOES || 25, Number(params.get("n")) || 25));
    const app = document.getElementById("app");

    function erroFatal(msg) {
      app.innerHTML = `<div class="container py-5" style="max-width:640px"><div class="cartao p-5 text-center">
        <i class="bi bi-exclamation-octagon fs-1 text-danger"></i><h3 class="mt-2">Não foi possível abrir o exame</h3>
        <p class="text-muted-2">${esc(msg)}</p><a class="btn btn-navy" href="painel.html">Voltar ao painel</a></div></div>`;
    }

    // ---------------- Ecrã inteiro obrigatório ----------------
    const FS_OK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    const emFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    async function entrarFS() {
      if (!FS_OK) return true;
      try {
        const el = document.documentElement;
        await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) : el.webkitRequestFullscreen());
        if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(() => {});
      } catch (e) { /* recusado pelo utilizador */ }
      return emFS();
    }

    await new Promise(resolve => {
      app.innerHTML = `<div class="container py-5" style="max-width:720px"><div class="cartao p-4 p-md-5">
        <span class="etiqueta">${TIPOS[tipo].nome}</span>
        <h2 class="upper mb-3"><i class="bi bi-shield-lock me-1"></i> Regras do exame</h2>
        <p>O exame decorre em <b>ecrã inteiro</b> e é vigiado durante todo o tempo. Conta como <b>incidente</b>:</p>
        <ul class="mb-3">
          <li>sair do ecrã inteiro (tecla Esc, F11 ou outra);</li>
          <li>mudar de aba, abrir outra janela ou aplicação, ou minimizar o navegador;</li>
          <li>reduzir a janela ou usar vista dividida;</li>
          <li>tentar capturar o ecrã, copiar ou colar texto;</li>
          <li>recarregar ou reabrir a página do exame.</li>
        </ul>
        <div class="alert alert-danger small"><i class="bi bi-exclamation-octagon me-1"></i>
          Cada incidente mostra um aviso. Ao <b>3.º incidente</b> o exame é <b>encerrado automaticamente e anulado (nota 0)</b>.</div>
        ${FS_OK ? "" : `<div class="alert alert-warning small"><i class="bi bi-phone me-1"></i> Este dispositivo não permite ecrã inteiro. A saída da página continua a ser vigiada.</div>`}
        <p class="small text-muted-2">O cronómetro só começa quando carregar no botão. Feche outras aplicações e garanta uma boa ligação à Internet.</p>
        <button class="btn btn-cyan w-100 py-3 fs-5" id="btnComecar"><i class="bi bi-arrows-fullscreen me-1"></i> Entrar em ecrã inteiro e começar</button>
        <a class="btn btn-link w-100 mt-2" href="painel.html">Voltar ao painel</a>
      </div></div>`;
      document.getElementById("btnComecar").onclick = async () => {
        if (await entrarFS() || !FS_OK) resolve();
        else toast("Para começar, aceite o modo de ecrã inteiro.", "aviso");
      };
    });
    app.innerHTML = `<div class="carregar"><div class="text-center"><div class="spinner-border text-primary mb-3"></div><div>A preparar o seu exame…</div></div></div>`;

    const { data: pacote, error } = await sb.rpc("iniciar_exame", { p_tipo: tipo, p_n: nPedido });
    if (error) { if (emFS()) document.exitFullscreen?.().catch(() => {}); return erroFatal(erroMsg(error)); }

    const Q = pacote.questoes;
    const chaveLocal = "prep_resp_" + pacote.tentativa_id;
    const chaveMarcadas = "prep_marc_" + pacote.tentativa_id;
    let respostas = Object.assign({}, pacote.respostas || {}, JSON.parse(localStorage.getItem(chaveLocal) || "{}"));
    let marcadas = new Set(JSON.parse(localStorage.getItem(chaveMarcadas) || "[]"));
    let atual = 0, submetido = false, sujo = false, tGuardar = null;

    const desvio = Date.parse(pacote.agora) - Date.now();          // relógio do servidor − relógio local
    const fim = Date.parse(pacote.iniciado_em) + pacote.duracao_seg * 1000;
    const restanteMs = () => fim - (Date.now() + desvio);
    const LETRAS = "ABCDEF";

    app.innerHTML = `
      <div class="barra-exame">
        <div class="container py-2 d-flex align-items-center gap-3">
          <div class="d-flex align-items-center gap-2 me-auto" style="min-width:0">${App.LOGO}
            <div style="min-width:0"><div class="titulo text-white upper text-truncate" style="font-size:1.2rem;line-height:1">${TIPOS[tipo].nome}</div>
            <div class="small text-truncate" style="color:#b9d4f2">${esc(perfil.nome)} · ${esc(perfil.codigo)}</div></div></div>
          <div class="text-end small d-none d-md-block" style="color:#b9d4f2">Respondidas<br><b class="text-white fs-6" id="contResp">0/${Q.length}</b></div>
          <span class="chip chip-ok d-none d-sm-inline-flex" id="chipInc" title="Incidentes de segurança"><i class="bi bi-shield-check"></i> <span>0/3</span></span>
          <div class="cronometro" id="crono" aria-live="polite">--:--:--</div>
        </div>
        <div class="progresso-fino"><div id="barraProg" style="width:0%"></div></div>
      </div>

      <main class="container py-4">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="cartao p-4 p-md-5" id="cartaoQuestao"></div>
            <div class="d-flex justify-content-between mt-3 gap-2">
              <button class="btn btn-light border px-4" id="btnAnt"><i class="bi bi-chevron-left"></i> Anterior</button>
              <button class="btn btn-light border" id="btnMarcar"><i class="bi bi-flag"></i> <span class="d-none d-sm-inline">Rever depois</span></button>
              <button class="btn btn-navy px-4" id="btnSeg">Seguinte <i class="bi bi-chevron-right"></i></button>
            </div>
            <p class="small text-muted-2 mt-3 d-none d-md-block"><i class="bi bi-keyboard"></i> Atalhos: teclas <b>A–D</b> para responder, <b>←</b> <b>→</b> para navegar.</p>
          </div>
          <div class="col-lg-4">
            <div class="cartao p-4 position-sticky" style="top:110px">
              <h5 class="titulo mb-3">Questões</h5>
              <div class="grelha-nav mb-3" id="grelha"></div>
              <div class="small text-muted-2 d-flex flex-wrap gap-3 mb-3">
                <span><span class="chip chip-ok">&nbsp;</span> Respondida</span>
                <span><span class="chip" style="background:var(--gold)">&nbsp;</span> Rever</span>
                <span><span class="chip chip-mute">&nbsp;</span> Por responder</span>
              </div>
              <button class="btn btn-cyan w-100 py-2" id="btnSubmeter"><i class="bi bi-send-check me-1"></i> Submeter exame</button>
              <div class="small text-muted-2 mt-2 text-center" id="estadoGuardar">&nbsp;</div>
            </div>
          </div>
        </div>
      </main>`;

    const grelha = document.getElementById("grelha");
    grelha.innerHTML = Q.map((q, i) => `<button type="button" data-i="${i}" aria-label="Questão ${i + 1}">${i + 1}</button>`).join("");
    grelha.addEventListener("click", e => { const b = e.target.closest("button"); if (b) ir(Number(b.dataset.i)); });

    function guardarLocal() {
      localStorage.setItem(chaveLocal, JSON.stringify(respostas));
      localStorage.setItem(chaveMarcadas, JSON.stringify([...marcadas]));
    }

    async function guardarServidor() {
      if (!sujo || submetido) return;
      sujo = false;
      const el = document.getElementById("estadoGuardar");
      const { error } = await sb.rpc("guardar_respostas", { p_tentativa: pacote.tentativa_id, p_respostas: respostas });
      if (error) { sujo = true; el.innerHTML = `<i class="bi bi-cloud-slash text-warning"></i> Sem ligação — respostas guardadas neste dispositivo`; }
      else el.innerHTML = `<i class="bi bi-cloud-check text-success"></i> Respostas guardadas às ${new Date().toLocaleTimeString("pt-PT")}`;
    }

    function atualizarGrelha() {
      const n = Object.keys(respostas).length;
      grelha.querySelectorAll("button").forEach((b, i) => {
        b.classList.toggle("respondida", respostas[Q[i].id] !== undefined);
        b.classList.toggle("marcada", marcadas.has(Q[i].id));
        b.classList.toggle("atual", i === atual);
      });
      document.getElementById("contResp").textContent = `${n}/${Q.length}`;
      document.getElementById("barraProg").style.width = `${(n / Q.length) * 100}%`;
    }

    function render() {
      const q = Q[atual];
      document.getElementById("cartaoQuestao").innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <span class="etiqueta">Questão ${atual + 1} de ${Q.length}</span>
          <span class="chip chip-info">${esc(q.area)}</span></div>
        <p class="enunciado mb-4">${esc(q.enunciado)}</p>
        <div role="radiogroup">${q.opcoes.map((o, i) => `
          <label class="opcao ${respostas[q.id] === i ? "selecionada" : ""}">
            <input type="radio" name="op" value="${i}" ${respostas[q.id] === i ? "checked" : ""}>
            <span class="letra">${LETRAS[i]}</span><span class="texto">${esc(o)}</span></label>`).join("")}</div>`;
      document.querySelectorAll(".opcao input").forEach(inp => inp.addEventListener("change", () => responder(Number(inp.value))));
      document.getElementById("btnAnt").disabled = atual === 0;
      document.getElementById("btnSeg").innerHTML = atual === Q.length - 1 ? `Rever <i class="bi bi-list-check"></i>` : `Seguinte <i class="bi bi-chevron-right"></i>`;
      document.getElementById("btnMarcar").classList.toggle("btn-warning", marcadas.has(q.id));
      atualizarGrelha();
    }

    function responder(i) {
      if (submetido) return;
      respostas[Q[atual].id] = i;
      guardarLocal(); sujo = true;
      clearTimeout(tGuardar); tGuardar = setTimeout(guardarServidor, 2500);
      render();
    }

    function ir(i) { atual = Math.max(0, Math.min(Q.length - 1, i)); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

    document.getElementById("btnAnt").onclick = () => ir(atual - 1);
    document.getElementById("btnSeg").onclick = () => {
      if (atual < Q.length - 1) return ir(atual + 1);
      const p = Q.findIndex(q => respostas[q.id] === undefined);
      ir(p >= 0 ? p : 0);
      if (p >= 0) toast("Esta é a primeira questão ainda sem resposta.", "info");
    };
    document.getElementById("btnMarcar").onclick = () => {
      const id = Q[atual].id;
      marcadas.has(id) ? marcadas.delete(id) : marcadas.add(id);
      guardarLocal(); render();
    };
    document.addEventListener("keydown", e => {
      if (submetido || document.querySelector(".modal.show")) return;
      if (e.key === "ArrowRight") ir(atual + 1);
      else if (e.key === "ArrowLeft") ir(atual - 1);
      else {
        const k = e.key.toUpperCase();
        const idx = LETRAS.indexOf(k) >= 0 ? LETRAS.indexOf(k) : "123456".indexOf(k);
        if (idx >= 0 && idx < Q[atual].opcoes.length) responder(idx);
      }
    });

    async function submeter(automatico) {
      if (submetido) return;
      submetido = true;
      clearInterval(tCrono);
      document.getElementById("aSubmeterTitulo").textContent = automatico ? "Tempo esgotado — a submeter o exame…" : "A submeter o exame…";
      document.getElementById("aSubmeter").classList.remove("d-none");
      for (let tentativa = 1; tentativa <= 5; tentativa++) {
        const { data, error } = await sb.rpc("submeter_exame", { p_tentativa: pacote.tentativa_id, p_respostas: respostas });
        if (!error) {
          localStorage.removeItem(chaveLocal); localStorage.removeItem(chaveMarcadas);
          if (emFS()) await document.exitFullscreen?.().catch(() => {});
          location.replace(`relatorio.html?id=${data.id}&novo=1`);
          return;
        }
        await new Promise(r => setTimeout(r, 2000 * tentativa));
        if (tentativa === 5) {
          document.getElementById("aSubmeter").classList.add("d-none");
          submetido = false;
          toast("Falha ao submeter: " + erroMsg(error) + " Verifique a ligação e tente de novo.", "erro");
        }
      }
    }

    document.getElementById("btnSubmeter").onclick = async () => {
      const falta = Q.length - Object.keys(respostas).length;
      const ok = await App.confirmar("Submeter exame?", falta
        ? `<div class="alert alert-warning mb-2"><i class="bi bi-exclamation-triangle"></i> Tem <b>${falta}</b> questão(ões) sem resposta.</div><p class="mb-0">Depois de submeter não poderá alterar as respostas.</p>`
        : `<p class="mb-0">Respondeu a todas as questões. Depois de submeter não poderá alterar as respostas.</p>`, "Submeter", "btn-cyan");
      if (ok) submeter(false);
    };

    // Cronómetro
    const crono = document.getElementById("crono");
    let avisou5 = false;
    function tick() {
      const ms = restanteMs();
      const s = Math.max(0, Math.ceil(ms / 1000));
      crono.textContent = fmtHMS(s);
      crono.classList.toggle("alerta", s <= 300 && s > 60);
      crono.classList.toggle("critico", s <= 60);
      if (s <= 300 && s > 290 && !avisou5) { avisou5 = true; toast("Faltam 5 minutos.", "aviso"); }
      if (ms <= 0) submeter(true);
    }
    const tCrono = setInterval(tick, 500);
    tick();
    setInterval(guardarServidor, 30000);

    window.addEventListener("beforeunload", e => { if (!submetido) { guardarLocal(); e.preventDefault(); e.returnValue = ""; } });

    // ---------------- Vigilância anti-fraude ----------------
    const LIMITE = pacote.limite_incidentes || 3;
    let incidentes = pacote.incidentes || 0, ultimoInc = 0, encerrando = false;
    const NOMES = {
      saiu_ecra_inteiro: "Saiu do ecrã inteiro",
      mudou_aba: "Mudou de aba ou minimizou o navegador",
      perdeu_foco: "Abriu outra janela ou aplicação",
      vista_dividida: "Reduziu a janela ou usou vista dividida",
      captura_ecra: "Tentou capturar o ecrã",
      reabriu_exame: "Recarregou ou reabriu o exame"
    };
    document.body.classList.add("exame-protegido");
    const aviso = document.createElement("div");
    aviso.id = "avisoFraude"; aviso.className = "d-none";
    document.body.appendChild(aviso);

    function atualizarChip() {
      const c = document.getElementById("chipInc");
      c.querySelector("span").textContent = `${incidentes}/${LIMITE}`;
      c.className = `chip d-none d-sm-inline-flex ${incidentes === 0 ? "chip-ok" : incidentes < LIMITE - 1 ? "chip-warn" : "chip-bad"}`;
    }

    function mostrarAviso(tipo) {
      document.body.classList.add("bloqueado");
      aviso.className = "";
      aviso.innerHTML = `<div class="cartao p-4 p-md-5 text-center" style="max-width:520px">
        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem"></i>
        <h3 class="upper mt-2 mb-1">Aviso ${incidentes} de ${LIMITE}</h3>
        <p class="fw-semibold mb-2">${esc(NOMES[tipo] || "Comportamento não permitido")}</p>
        <p class="small text-muted-2 mb-4">${incidentes >= LIMITE - 1
          ? "<b class='text-danger'>Último aviso:</b> no próximo incidente o exame é encerrado e anulado."
          : `Ao ${LIMITE}.º incidente o exame é encerrado e anulado. O cronómetro continua a contar.`}</p>
        <button class="btn btn-cyan w-100 py-2" id="btnVoltarExame"><i class="bi bi-arrows-fullscreen me-1"></i> Voltar ao exame</button>
      </div>`;
      document.getElementById("btnVoltarExame").onclick = async () => {
        if (await entrarFS() || !FS_OK) { aviso.className = "d-none"; document.body.classList.remove("bloqueado"); }
        else toast("Volte ao ecrã inteiro para continuar.", "aviso");
      };
    }

    async function encerrarPorFraude() {
      if (encerrando) return;
      encerrando = submetido = true;
      clearInterval(tCrono);
      localStorage.removeItem(chaveLocal); localStorage.removeItem(chaveMarcadas);
      document.body.classList.add("bloqueado");
      aviso.className = "";
      aviso.innerHTML = `<div class="cartao p-4 p-md-5 text-center" style="max-width:520px">
        <i class="bi bi-x-octagon-fill text-danger" style="font-size:3rem"></i>
        <h3 class="upper mt-2">Exame encerrado</h3>
        <p class="mb-0">Atingiu ${LIMITE} incidentes de segurança. O exame foi submetido e <b>anulado</b>.</p></div>`;
      setTimeout(() => { document.exitFullscreen?.().catch(() => {}); location.replace(`relatorio.html?id=${pacote.tentativa_id}&novo=1`); }, 3000);
    }

    async function incidente(tipo) {
      if (submetido || encerrando) return;
      const agora = Date.now();
      if (agora - ultimoInc < 3000) return;         // vários eventos do mesmo gesto contam uma vez
      ultimoInc = agora;
      incidentes++; atualizarChip(); mostrarAviso(tipo); guardarLocal();
      for (let k = 0; k < 3; k++) {
        const { data, error } = await sb.rpc("registar_incidente", { p_tentativa: pacote.tentativa_id, p_tipo: tipo, p_respostas: respostas });
        if (!error && data) { incidentes = data.total; atualizarChip(); if (data.encerrado) encerrarPorFraude(); return; }
        await new Promise(r => setTimeout(r, 2000));
      }
    }

    let base = { w: window.innerWidth, h: window.innerHeight, deitado: window.innerWidth > window.innerHeight };
    document.addEventListener("fullscreenchange", () => { if (FS_OK && !emFS()) incidente("saiu_ecra_inteiro"); });
    document.addEventListener("webkitfullscreenchange", () => { if (FS_OK && !emFS()) incidente("saiu_ecra_inteiro"); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) { guardarServidor(); incidente("mudou_aba"); } });
    window.addEventListener("blur", () => setTimeout(() => { if (!document.hidden && !document.hasFocus()) incidente("perdeu_foco"); }, 400));
    window.addEventListener("resize", () => {
      if (FS_OK && !emFS()) return;                   // já contado como saída do ecrã inteiro
      const deitado = window.innerWidth > window.innerHeight;
      if (deitado !== base.deitado) { base = { w: window.innerWidth, h: window.innerHeight, deitado }; return; }   // rodar o telemóvel não conta
      if (window.innerWidth < base.w * 0.85 || window.innerHeight < base.h * 0.7) incidente("vista_dividida");
    });
    ["contextmenu", "copy", "cut", "paste", "selectstart", "dragstart", "drop"].forEach(ev =>
      document.addEventListener(ev, e => { if (!e.target.closest || !e.target.closest("input, textarea")) e.preventDefault(); }));
    document.addEventListener("keydown", e => {
      const k = e.key.toLowerCase(), ctrl = e.ctrlKey || e.metaKey;
      if (e.key === "F12" || e.key === "F5" || (ctrl && ["c", "x", "v", "a", "p", "s", "u", "r", "f", "t", "n", "w"].includes(k)) ||
          (ctrl && e.shiftKey && ["i", "j", "c"].includes(k))) { e.preventDefault(); e.stopPropagation(); }
    }, true);
    document.addEventListener("keyup", e => {
      if (e.key === "PrintScreen") { navigator.clipboard?.writeText("").catch(() => {}); incidente("captura_ecra"); }
    });

    atualizarChip();
    if (incidentes > 0) toast(`Atenção: este exame já tem ${incidentes} incidente(s) de segurança.`, "aviso");
    // reabrir/recarregar um exame já começado conta como incidente
    if ((Date.now() + desvio) - Date.parse(pacote.iniciado_em) > 20000) incidente("reabriu_exame");

    render();
  })();
  </script>
</body>
</html>
