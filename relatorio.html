<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório do exame — PrepConcurso AO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilo.css?v=10" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>
  <main class="container py-4" id="conteudo"><div class="carregar"><div class="spinner-border text-primary"></div></div></main>
  <section id="publicidade" class="nao-imprimir"></section>
  <footer id="rodape"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
  <script src="js/anuncios.js?v=10"></script>
  <script>
  (async () => {
    const { sb, esc, erroMsg, fmtNota, fmtData, fmtHMS, TIPOS, cfg } = App;
    const perfil = await App.exigirSessao();
    App.renderTopo(perfil, "");
    App.renderRodape();
    const el = document.getElementById("conteudo");
    const id = new URLSearchParams(location.search).get("id");

    const { data: t, error } = await sb.from("tentativas")
      .select("*, perfis(nome, codigo, categorias(nome)), categorias(nome)")
      .eq("id", id).maybeSingle();
    if (error || !t) {
      el.innerHTML = `<div class="alert alert-danger">${esc(error ? erroMsg(error) : "Relatório não encontrado.")} <a href="painel.html">Voltar ao painel</a></div>`;
      return;
    }
    if (t.estado !== "submetido") { location.href = `exame.html?tipo=${t.tipo}`; return; }

    const cand = t.perfis || {};
    const categoria = (t.categorias && t.categorias.nome) || (cand.categorias && cand.categorias.nome) || "—";
    const naoResp = t.n_questoes - t.respondidas;
    const erradas = t.respondidas - t.acertos;
    const nota = Number(t.nota);
    const minimo = t.tipo === "psico" ? (cfg.NOTA_MINIMA_PSICO || 10) : 10;
    const apto = nota >= minimo && !t.anulado;
    const INCIDENTES = { saiu_ecra_inteiro: "Saiu do ecrã inteiro", mudou_aba: "Mudou de aba ou minimizou o navegador",
      perdeu_foco: "Abriu outra janela ou aplicação", vista_dividida: "Reduziu a janela ou usou vista dividida",
      captura_ecra: "Tentou capturar o ecrã", reabriu_exame: "Recarregou ou reabriu o exame" };
    const passo = Math.max(1, Math.ceil(t.n_questoes / 5));
    const ticks = []; for (let v = 0; v <= t.n_questoes + passo - 1; v += passo) ticks.push(v);
    const topo = ticks[ticks.length - 1] || 1;

    const areas = Object.entries(t.detalhe || {}).sort((a, b) => a[0].localeCompare(b[0]));
    const veredicto = t.tipo === "psico"
      ? (apto ? `<b>APTO</b> — pode avançar para a Aferição de Conhecimentos.` : `<b>NÃO APTO</b> — nota inferior a ${minimo} valores. Solicite a 2.ª via do teste psicotécnico (botão verde do WhatsApp).`)
      : t.tipo === "minint"
      ? (apto ? `<b>APROVADO</b> no teste de preparação para a prova escrita do MININT.` : `<b>NÃO APROVADO</b> — nota inferior a 10 valores. Pode solicitar a 2.ª via do teste.`)
      : (apto ? `<b>APROVADO</b> na aferição de conhecimentos da categoria.` : `<b>NÃO APROVADO</b> — nota inferior a 10 valores.`);

    el.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-3 nao-imprimir flex-wrap gap-2">
        <a href="painel.html" class="btn btn-light border"><i class="bi bi-arrow-left"></i> Painel</a>
        <div class="d-flex gap-2">
          ${t.tipo === "psico" && apto && t.user_id === perfil.id ? `<a href="painel.html" class="btn btn-cyan"><i class="bi bi-mortarboard me-1"></i> Seguir para Conhecimentos</a>` : ""}
          ${t.user_id === perfil.id ? `<button class="btn btn-cyan" id="btnPartilharRel"><i class="bi bi-file-earmark-image me-1"></i> Partilhar relatório com a nota</button>` : ""}
          <button class="btn btn-outline-navy" id="btnPartilhar"><i class="bi bi-share me-1"></i> Partilhar</button>
          ${!apto && t.user_id === perfil.id ? `<button class="btn btn-whats" id="btnSegunda"><i class="bi bi-whatsapp me-1"></i> Solicitar 2.ª via</button>` : ""}
          <button class="btn btn-navy" onclick="window.print()"><i class="bi bi-printer me-1"></i> Imprimir / PDF</button>
        </div>
      </div>

      <article class="relatorio">
        <div class="cabecalho">
          <div class="d-flex justify-content-center mb-2">${App.LOGO.replace('class="marca-icone"', 'width="54" height="54"')}</div>
          <div class="inst">${esc(cfg.NOME_PLATAFORMA)}</div>
          <div class="sub">${esc(cfg.SUBTITULO)} · Simulação de exame</div>
        </div>

        <div class="dados">
          <p><b>Código:</b> ${esc(cand.codigo)}</p>
          <p><b>Candidato:</b> ${esc(cand.nome)}</p>
          <p><b>Categoria:</b> ${esc(categoria)}</p>
        </div>

        <div class="sucesso">
          <h2><i class="bi bi-check-circle-fill text-success me-1"></i> EXAME SUBMETIDO COM SUCESSO</h2>
          <div class="text-muted-2">${TIPOS[t.tipo].nome}${t.tipo === "minint" ? " — Teste independente" : ` — Etapa ${t.tipo === "psico" ? 1 : 2}`}</div>
        </div>

        <div class="row g-4">
          <div class="col-md-8">
            <div class="linha-dado mb-4" style="font-size:1.45rem"><b>Nota:</b> ${fmtNota(t.nota)} valores</div>
            <div class="linha-dado"><b>Total de questões:</b> <span>${t.n_questoes} perguntas</span></div>
            <div class="linha-dado"><b>Duração do exame:</b> <span>${fmtHMS(t.duracao_seg)}</span></div>
            <div class="linha-dado mb-4"><b>Tempo de submissão:</b> <span>${fmtHMS(t.tempo_seg)}</span></div>

            <div class="grafico-barras mt-3" style="max-width:420px">
              <div class="eixo">${ticks.map(v => `<span>${v}</span>`).join("")}</div>
              <div class="barra" style="height:${(t.respondidas / topo) * 100}%" title="Respondidas: ${t.respondidas}"></div>
              <div class="barra nao" style="height:${(naoResp / topo) * 100}%" title="Não respondidas: ${naoResp}"></div>
            </div>
            <div class="text-center legenda mt-1" style="max-width:420px">Estatística</div>
            <div class="legenda mt-2"><i style="background:#6fd34c"></i>Respondidas (${t.respondidas})</div>
            <div class="legenda"><i style="background:#8a9099"></i>Não respondidas (${naoResp})</div>
          </div>
          <div class="col-md-4 importante">
            <h6>Importante</h6>
            <p>Este relatório é um comprovativo de treino. Para informações adicionais use a sua conta reservada na plataforma.</p>
            <h6 class="mt-3">Data da submissão</h6>
            <p>${fmtData(t.submetido_em)}</p>
            <h6 class="mt-3">Resumo</h6>
            <p class="mb-1">Certas: <b>${t.acertos}</b></p>
            <p class="mb-1">Erradas: <b>${erradas}</b></p>
            <p>Em branco: <b>${naoResp}</b></p>
          </div>
        </div>

        ${t.anulado ? `<div class="veredicto nao-apto mt-4"><i class="bi bi-x-octagon-fill"></i><div><b>EXAME ANULADO</b> — encerrado automaticamente após ${(t.incidentes || []).length} incidentes de segurança. A nota foi fixada em 0 valores.</div></div>` : ""}
        ${(t.incidentes || []).length ? `<div class="small mt-3"><b><i class="bi bi-shield-exclamation text-danger me-1"></i>Incidentes de segurança registados (${t.incidentes.length}):</b>
          <ul class="mb-0">${t.incidentes.map(i => `<li>${fmtData(i.em)} — ${esc(INCIDENTES[i.tipo] || i.tipo)}</li>`).join("")}</ul></div>` : ""}
        <div class="veredicto ${apto ? "apto" : "nao-apto"} mt-4">
          <i class="bi ${apto ? "bi-patch-check-fill" : "bi-exclamation-octagon-fill"}"></i><div>${veredicto}</div>
        </div>

        ${areas.length ? `<h5 class="titulo mt-4 mb-3 upper">Desempenho por área</h5>
          <div class="row g-3">${areas.map(([a, v]) => {
            const pct = Math.round((v.acertos / v.total) * 100);
            return `<div class="col-md-6"><div class="d-flex justify-content-between small mb-1"><span>${esc(a)}</span>
              <b>${v.acertos}/${v.total} · ${pct}%</b></div><div class="barra-area"><div style="width:${pct}%"></div></div></div>`;
          }).join("")}</div>` : ""}
      </article>`;

    document.getElementById("btnPartilhar").addEventListener("click", () => App.mostrarResultado({ t, perfil }));
    const bs = document.getElementById("btnSegunda");
    if (bs) bs.addEventListener("click", () => App.pedirSegundaVia({ perfil, tipo: t.tipo }));
    const bpr = document.getElementById("btnPartilharRel");
    if (bpr) bpr.addEventListener("click", () => App.partilharRelatorio({ t, perfil: { ...perfil, nome: cand.nome, codigo: cand.codigo }, categoria: categoria === "—" ? "" : categoria }));
    const qs = new URLSearchParams(location.search);
    if (qs.get("novo") === "1" && t.user_id === perfil.id) {
      history.replaceState(null, "", `relatorio.html?id=${t.id}`);   // o popup aparece só uma vez
      setTimeout(() => App.mostrarResultado({ t, perfil }), 500);
    }
  })();
  </script>
</body>
</html>
