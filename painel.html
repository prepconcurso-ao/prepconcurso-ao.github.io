<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do candidato — PrepConcurso AO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilo.css?v=12" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>
  <section id="publicidade"></section>
  <main class="container pt-1 pb-4" id="conteudo">
    <div class="carregar"><div class="spinner-border text-primary"></div></div>
  </main>
  <footer id="rodape"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=12"></script>
  <script src="js/app.js?v=12"></script>
  <script src="js/anuncios.js?v=12"></script>
  <script>
  (async () => {
    const { sb, esc, toast, erroMsg, fmtNota, fmtData, fmtHMS, TIPOS, AREAS_PSICO, cfg } = App;
    let perfil = await App.exigirSessao();
    if (App.perfilIncompleto(perfil)) { await App.completarPerfil(perfil); perfil = await App.perfilAtual(); }
    await App.aplicarConvite(perfil);
    App.renderTopo(perfil, "painel");
    App.renderRodape();
    const NOTA_MIN = cfg.NOTA_MINIMA_PSICO || 10;
    const MIN = cfg.MIN_QUESTOES || 25, MAX = cfg.MAX_QUESTOES || 50;
    const TEXTO_PARTILHA = `Estou a treinar para os concursos públicos (ENAPP, MININT e outros) na ${cfg.NOME_PLATAFORMA}: testes psicotécnicos e de conhecimentos cronometrados, grátis. Treina também:`;

    async function carregar() {
      const [est, tent, conv] = await Promise.all([
        sb.rpc("meu_estado"),
        sb.from("tentativas").select("id, tipo, n_questoes, nota, acertos, respondidas, tempo_seg, submetido_em, estado, anulado")
          .eq("user_id", perfil.id).eq("estado", "submetido").order("submetido_em", { ascending: false }),
        sb.rpc("meus_convites")
      ]);
      if (est.error) throw est.error;
      if (tent.error) throw tent.error;
      render(est.data, tent.data, conv.error ? null : conv.data);
    }

    function blocoInicio(tipo) {
      return `
        <label class="form-label mb-1" for="n_${tipo}">Número de questões: <b id="nv_${tipo}">${MIN}</b></label>
        <input type="range" class="form-range" min="${MIN}" max="${MAX}" step="1" value="${MIN}" id="n_${tipo}">
        <div class="d-flex justify-content-between small text-muted-2 mb-3"><span>${MIN}</span>
          <span><i class="bi bi-stopwatch"></i> Duração: <b id="dv_${tipo}">${fmtHMS(MIN * 60)}</b></span><span>${MAX}</span></div>
        <button class="btn btn-navy w-100 py-2" data-iniciar="${tipo}"><i class="bi bi-play-circle me-1"></i> Iniciar ${TIPOS[tipo].curto}</button>`;
    }

    function blocoPedido(tipo, s) {
      if (s.ultimo_pedido === "pendente")
        return `<div class="chip chip-warn mt-3"><i class="bi bi-hourglass-split"></i> Pedido de 2.ª via a aguardar aprovação</div>
          <button class="btn btn-link btn-sm px-0 d-block" data-pedir="${tipo}"><i class="bi bi-whatsapp text-success"></i> Reenviar pedido pelo WhatsApp</button>`;
      const rej = s.ultimo_pedido === "rejeitado" ? `<div class="small text-danger mt-3"><i class="bi bi-x-circle"></i> O seu último pedido foi rejeitado. Pode fazer um novo pedido.</div>` : "";
      return `${rej}<button class="btn btn-whats w-100 mt-3" data-pedir="${tipo}"><i class="bi bi-whatsapp me-1"></i> Solicitar 2.ª via do teste</button>`;
    }

    function cartaoEtapa(tipo, num, s, ultima, largura = "col-lg-6") {
      const conhecBloq = tipo === "conhecimento" && !s.desbloqueado;
      let corpo = "", estado = "";
      if (s.em_curso) {
        estado = `<span class="chip chip-warn"><i class="bi bi-play-fill"></i> Em curso</span>`;
        corpo = `<p class="mb-3">Tem um exame em curso. O cronómetro continua a contar.</p>
                 <a class="btn btn-cyan w-100 py-2" href="exame.html?tipo=${tipo}"><i class="bi bi-arrow-right-circle me-1"></i> Retomar exame</a>`;
      } else if (s.pode_iniciar) {
        estado = s.feitos > 0 ? `<span class="chip chip-info"><i class="bi bi-check2"></i> Repetição autorizada</span>`
                              : `<span class="chip chip-mute">Por realizar</span>`;
        corpo = blocoInicio(tipo);
      } else if (s.feitos > 0) {
        const apto = tipo === "psico" ? Number(s.ultima_nota) >= NOTA_MIN : Number(s.ultima_nota) >= 10;
        estado = apto ? `<span class="chip chip-ok"><i class="bi bi-check-circle"></i> ${tipo === "psico" ? "Apto" : "Aprovado"}</span>`
                      : `<span class="chip chip-bad"><i class="bi bi-x-circle"></i> ${tipo === "psico" ? "Não apto" : "Não aprovado"}</span>`;
        corpo = `<div class="d-flex align-items-end gap-2 mb-2"><div class="nota-grande ${apto ? "text-success" : "text-danger"}">${fmtNota(s.ultima_nota)}</div><div class="pb-1 text-muted-2">valores · última tentativa</div></div>
          ${tipo === "psico" && !apto && !(s.melhor_nota >= NOTA_MIN) ? `<div class="alert alert-warning small py-2">Obteve menos de ${NOTA_MIN} valores. Para avançar para a aferição de conhecimentos, solicite a 2.ª via do teste psicotécnico.</div>` : ""}
          ${ultima ? `<a class="btn btn-light border w-100" href="relatorio.html?id=${ultima.id}"><i class="bi bi-file-earmark-text me-1"></i> Ver relatório</a>` : ""}
          ${blocoPedido(tipo, s)}`;
      }

      const descr = tipo === "psico"
        ? `<ul class="areas-lista mb-3">${AREAS_PSICO.map(a => `<li class="chip chip-info">${esc(a)}</li>`).join("")}</ul>`
        : tipo === "minint"
        ? `<p class="mb-2 text-muted-2">Preparação para a prova escrita do Ministério do Interior: Lei de Bases da Função Pública, pauta deontológica, Constituição, organização do MININT, comportamento e cultura geral.</p>
           <div class="mb-3"><span class="chip chip-ok"><i class="bi bi-unlock"></i> Acesso livre — não precisa do psicotécnico</span></div>`
        : `<p class="mb-3 text-muted-2">Questões técnicas da categoria <b class="text-dark">${esc(perfil.categorias?.nome || "—")}</b>.</p>`;

      const cadeado = conhecBloq ? `<div class="cadeado"><div><i class="bi bi-lock-fill fs-1 text-primary"></i>
          <h5 class="titulo mt-2 mb-1">Etapa bloqueada</h5><p class="small mb-0">Disponível após obter ${NOTA_MIN} valores ou mais no Teste Psicotécnico.</p></div></div>` : "";

      return `<div class="${largura}" id="cartao_${tipo}"><div class="cartao etapa p-4 h-100 ${conhecBloq ? "bloqueada" : ""}">
          ${cadeado}<div class="numero-etapa">${num ? "0" + num : "M"}</div>
          <span class="etiqueta">${num ? "Etapa " + num : "Teste independente"}</span>
          <h3 class="mb-2"><i class="bi ${TIPOS[tipo].icone} me-1"></i>${TIPOS[tipo].nome}</h3>
          <div class="mb-3">${estado}</div>${descr}${corpo}</div></div>`;
    }

    // ---------- Convites com prémio ----------
    function cartaoConvites(cv, estado) {
      if (!cv) return "";
      const link = App.linkConvite(perfil);
      const prog = cv.validos % cv.por_premio, pct = Math.round(prog / cv.por_premio * 100);
      const tiposResgate = Object.keys(TIPOS).filter(k => estado[k] && estado[k].feitos > 0 && !estado[k].pode_iniciar && estado[k].desbloqueado);
      return `<div class="cartao cartao-convite p-4 mt-4" id="convites">
        <div class="d-flex flex-wrap align-items-start gap-3">
          <div class="cv-icone"><i class="bi bi-gift-fill"></i></div>
          <div class="flex-grow-1" style="min-width:240px">
            <h4 class="mb-1">Convide 3 amigos e ganhe uma nova tentativa</h4>
            <p class="text-muted-2 small mb-0">A cada <b>${cv.por_premio} amigos</b> que se cadastrem pelo seu link e façam pelo menos um teste, ganha uma <b>2.ª via automática</b> — sem esperar pela aprovação.</p>
          </div>
        </div>
        <div class="row g-4 mt-1">
          <div class="col-lg-6">
            <label class="form-label small fw-semibold mb-1">O seu link de convite</label>
            <div class="input-group mb-3"><input class="form-control" id="linkConvite" value="${esc(link)}" readonly>
              <button class="btn btn-navy" id="btnCopiarConvite"><i class="bi bi-clipboard"></i> Copiar</button></div>
            <div id="partilhaPainel">${App.botoesPartilha(TEXTO_PARTILHA, link)}</div>
          </div>
          <div class="col-lg-6">
            <div class="cv-progresso p-3">
              <div class="d-flex justify-content-between align-items-end mb-1">
                <b>Próximo prémio</b><span class="small text-muted-2">${prog} de ${cv.por_premio} amigos</span></div>
              <div class="progress mb-2" style="height:14px" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar bg-success" style="width:${pct}%"></div></div>
              <div class="small text-muted-2">${cv.total} convidado(s) · ${cv.validos} já fizeram teste · ${cv.premios_usados} prémio(s) usado(s)</div>
              ${cv.premios_disponiveis > 0 ? `
                <div class="cv-premio mt-3 p-3">
                  <div class="fw-bold mb-2"><i class="bi bi-stars me-1"></i> Tem ${cv.premios_disponiveis} prémio(s) para usar!</div>
                  ${tiposResgate.length ? `<div class="input-group">
                      <select class="form-select" id="tipoPremio">${tiposResgate.map(k => `<option value="${k}">${esc(TIPOS[k].nome)}</option>`).join("")}</select>
                      <button class="btn btn-success" id="btnResgatar"><i class="bi bi-arrow-repeat me-1"></i> Usar agora</button></div>`
                    : `<div class="small">Pode usá-lo quando tiver um teste já feito e sem tentativa disponível.</div>`}
                </div>` : ""}
              ${cv.convidados.length ? `<div class="mt-3 small"><b>Os seus convidados:</b> ${cv.convidados.slice(0, 12).map(c =>
                  `<span class="chip ${c.valido ? "chip-ok" : "chip-mute"} me-1 mb-1">${c.valido ? '<i class="bi bi-check2"></i>' : '<i class="bi bi-hourglass"></i>'} ${esc(c.nome)}</span>`).join("")}
                  ${cv.convidados.length > 12 ? `<span class="text-muted-2">+${cv.convidados.length - 12}</span>` : ""}</div>` : ""}
            </div>
          </div>
        </div>
      </div>`;
    }

    // ---------- Ranking semanal ----------
    function cartaoRanking() {
      return `<div class="cartao p-4 mt-4" id="ranking">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h4 class="mb-0"><i class="bi bi-trophy-fill me-1" style="color:#c99a00"></i> Ranking da semana</h4>
          <a class="btn btn-sm btn-outline-navy" href="ranking.html">Ver ranking completo ›</a></div>
        <ul class="nav nav-pills auth gap-2 mb-3" id="rkTabs">
          ${Object.keys(TIPOS).map((k, i) => `<li class="nav-item"><button class="nav-link ${i === 0 ? "active" : ""}" data-rk="${k}">${esc(TIPOS[k].curto)}</button></li>`).join("")}</ul>
        <div id="rkLista"><div class="text-muted-2 small">A carregar…</div></div>
        <div class="form-check form-switch mt-3 small">
          <input class="form-check-input" type="checkbox" id="rkVisivel" ${perfil.ranking_visivel !== false ? "checked" : ""}>
          <label class="form-check-label" for="rkVisivel">Mostrar o meu nome no ranking (só o primeiro nome e a inicial do apelido)</label></div>
      </div>`;
    }

    async function carregarRanking(tipo) {
      const alvo = document.getElementById("rkLista");
      const { data, error } = await sb.rpc("ranking_semanal", { p_tipo: tipo, p_limite: 5 });
      if (error) { alvo.innerHTML = `<div class="text-danger small">${esc(erroMsg(error))}</div>`; return; }
      alvo.innerHTML = App.tabelaRanking(data, { vazio: "Ainda ninguém fez este teste esta semana. Seja o primeiro! 🚀" });
    }

    function render(estado, tentativas, convites) {
      const ultimaPsico = tentativas.find(t => t.tipo === "psico");
      const ultimaCon = tentativas.find(t => t.tipo === "conhecimento");
      const ultimaMinint = tentativas.find(t => t.tipo === "minint");
      document.getElementById("conteudo").innerHTML = `
        <div class="cartao-navy p-4 p-md-5 mb-4">
          <span class="etiqueta">Painel do candidato</span>
          <h1 class="mb-3 upper">Olá, ${esc(perfil.nome)}</h1>
          <div class="row g-3 position-relative" style="z-index:1">
            <div class="col-sm-6 col-lg-3"><div class="destaque-info"><b>Código</b><div>${esc(perfil.codigo)}</div></div></div>
            <div class="col-sm-6 col-lg-5"><div class="destaque-info"><b>Categoria</b><div>${esc(perfil.categorias?.nome || "Não definida")}</div></div></div>
            <div class="col-sm-6 col-lg-4"><div class="destaque-info"><b><i class="bi bi-whatsapp"></i> WhatsApp</b><div>${perfil.contacto ? "+244 " + esc(App.fmtWhats(perfil.contacto)) : esc(perfil.email || "—")}</div></div></div>
          </div>
        </div>

        ${estado.minint && estado.minint.desbloqueado ? `<div class="banner-minint mb-4">
          <div class="bm-icone"><i class="bi bi-shield-shaded"></i></div>
          <div class="flex-grow-1"><span class="bm-novo">Novo</span>
            <h3 class="mb-1">Prova Escrita MININT — treine já</h3>
            <p class="mb-0">Teste de preparação com questões da Lei de Bases da Função Pública, pauta deontológica e temas do Ministério do Interior. <b>Acesso livre, sem passar pelo psicotécnico.</b></p></div>
          <a href="#cartao_minint" class="btn btn-amarelo flex-shrink-0"><i class="bi bi-play-circle me-1"></i> Fazer o teste MININT</a>
        </div>` : ""}

        <div class="alert alert-light border small mb-4"><i class="bi bi-info-circle text-primary me-1"></i>
          Cada teste pode ser feito <b>uma vez</b>. Tem 1 minuto por questão; quando o tempo acaba o exame é submetido automaticamente.
          Para repetir um teste, use <b>Solicitar 2.ª via</b>: o pedido segue pelo WhatsApp e o administrador aprova-o.</div>

        <div class="row g-4 mb-4">
          ${cartaoEtapa("psico", 1, estado.psico, ultimaPsico)}
          ${cartaoEtapa("conhecimento", 2, estado.conhecimento, ultimaCon)}
          ${estado.minint && estado.minint.desbloqueado ? cartaoEtapa("minint", 0, estado.minint, ultimaMinint, "col-12") : ""}
        </div>

        <div class="cartao p-4">
          <h4 class="mb-3"><i class="bi bi-clock-history me-1"></i> Histórico de exames</h4>
          ${tentativas.length ? `<div class="table-wrap"><table class="table table-hover mb-0">
            <thead><tr><th>Data</th><th>Teste</th><th>Questões</th><th>Acertos</th><th>Tempo</th><th>Nota</th><th></th></tr></thead>
            <tbody>${tentativas.map(t => `<tr>
              <td>${fmtData(t.submetido_em)}</td><td>${TIPOS[t.tipo].nome}</td><td>${t.n_questoes}</td>
              <td>${t.acertos}/${t.n_questoes}</td><td>${fmtHMS(t.tempo_seg)}</td>
              <td><span class="chip ${t.nota >= 10 ? "chip-ok" : "chip-bad"}">${fmtNota(t.nota)} val.</span>${t.anulado ? ` <span class="chip chip-bad" title="Encerrado por incidentes de segurança">anulado</span>` : ""}</td>
              <td class="text-end"><a class="btn btn-sm btn-light border" href="relatorio.html?id=${t.id}">Relatório</a></td></tr>`).join("")}
            </tbody></table></div>` : `<p class="text-muted-2 mb-0">Ainda não realizou nenhum exame.</p>`}
        </div>

        ${cartaoConvites(convites, estado)}
        ${cartaoRanking()}`;
      const linkC = App.linkConvite(perfil);
      const pp = document.getElementById("partilhaPainel");
      if (pp) App.ligarPartilha(pp, TEXTO_PARTILHA, linkC);
      const bc = document.getElementById("btnCopiarConvite");
      if (bc) bc.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(linkC); } catch { const i = document.getElementById("linkConvite"); i.select(); document.execCommand("copy"); }
        toast("Link de convite copiado. Envie-o aos amigos pelo WhatsApp!", "ok");
      });
      const br = document.getElementById("btnResgatar");
      if (br) br.addEventListener("click", async () => {
        const tipo = document.getElementById("tipoPremio").value;
        br.disabled = true;
        const { error } = await sb.rpc("resgatar_premio_convite", { p_tipo: tipo });
        br.disabled = false;
        if (error) return toast(erroMsg(error), "erro");
        toast(`Prémio usado! Já pode fazer de novo o ${TIPOS[tipo].nome}.`, "ok");
        carregar();
      });
      // ranking
      document.querySelectorAll("[data-rk]").forEach(b => b.addEventListener("click", () => {
        document.querySelectorAll("[data-rk]").forEach(x => x.classList.toggle("active", x === b));
        carregarRanking(b.dataset.rk);
      }));
      carregarRanking("psico");
      document.getElementById("rkVisivel").addEventListener("change", async e => {
        const { error } = await sb.rpc("definir_ranking_visivel", { p_visivel: e.target.checked });
        if (error) { e.target.checked = !e.target.checked; return toast(erroMsg(error), "erro"); }
        perfil.ranking_visivel = e.target.checked;
        toast(e.target.checked ? "O seu nome volta a aparecer no ranking." : "Saiu do ranking. O seu nome deixa de aparecer.", "ok");
        carregarRanking(document.querySelector("[data-rk].active").dataset.rk);
      });

      // sliders
      document.querySelectorAll("input[type=range]").forEach(r => {
        const tipo = r.id.replace("n_", "");
        r.addEventListener("input", () => {
          document.getElementById("nv_" + tipo).textContent = r.value;
          document.getElementById("dv_" + tipo).textContent = fmtHMS(r.value * 60);
        });
      });

      document.querySelectorAll("[data-iniciar]").forEach(b => b.addEventListener("click", async () => {
        const tipo = b.dataset.iniciar;
        const n = Number(document.getElementById("n_" + tipo).value);
        const ok = await App.confirmar(`Iniciar ${TIPOS[tipo].nome}`, `
          <p>Vai iniciar um teste com <b>${n} questões</b> e <b>${fmtHMS(n * 60)}</b> de duração.</p>
          <ul class="small mb-0">
            <li>O cronómetro começa imediatamente e não pode ser pausado.</li>
            <li>Pode navegar entre questões e alterar respostas até submeter.</li>
            <li>Se o tempo terminar, o exame é submetido automaticamente.</li>
            <li>Só tem direito a <b>uma tentativa</b>.</li>
          </ul>`, "Começar agora", "btn-cyan");
        if (ok) location.href = `exame.html?tipo=${tipo}&n=${n}`;
      }));

      document.querySelectorAll("[data-pedir]").forEach(b => b.addEventListener("click", () => {
        const tipo = b.dataset.pedir;
        App.pedirSegundaVia({ perfil, tipo, aoConcluir: carregar });
      }));
    }

    try { await carregar(); }
    catch (e) {
      document.getElementById("conteudo").innerHTML = `<div class="alert alert-danger">${esc(erroMsg(e))}</div>`;
    }
  })();
  </script>
</body>
</html>
